# Ready-to-paste CI workflow (O10 of design.md in this folder).
# NOT ACTIVE from this path. Installing it requires the `workflows` token
# permission, which the agent push did not have (remote rejected
# .github/workflows/verify.yml on 2026-10-07). Owner step: copy this file to
# .github/workflows/verify.yml (dropping these four comment lines is optional)
# and push it with a token that carries the workflows permission.
name: verify
on: [push, pull_request]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # tools/quality.mjs --changed needs the merge-base with origin/main
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --prefer-offline
      - run: npm run verify:fast
